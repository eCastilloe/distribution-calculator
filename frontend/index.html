<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de distribuciones Z, t, χ² y F</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Calculadora de distribuciones Z, t, χ² y F</h1>
    <p>Elige la distribución, el tipo de problema y escribe tus datos.</p>
  </header>

  <main>
    <section class="card input-card">
      <h2>1. Datos del problema</h2>

      <div class="setup">
        <div>
          <div class="choice" role="radiogroup" aria-label="Distribución">
            <label class="choice-option">
              <input type="radio" name="distribution" value="z" checked>
              <span>Z <small>Normal</small></span>
            </label>
            <label class="choice-option">
              <input type="radio" name="distribution" value="t">
              <span>t <small>Student</small></span>
            </label>
            <label class="choice-option">
              <input type="radio" name="distribution" value="chi2">
              <span>χ² <small>Chi cuadrada</small></span>
            </label>
            <label class="choice-option">
              <input type="radio" name="distribution" value="f">
              <span>F <small>Fisher</small></span>
            </label>
          </div>
          <p id="distribution-hint" class="hint"></p>
        </div>
        <div>
          <label class="field">
            <span>¿Qué quieres calcular?</span>
            <select id="problem"></select>
          </label>
          <p id="problem-hint" class="hint"></p>
        </div>
      </div>

      <form id="form" novalidate>
        <div id="fields"></div>
        <button type="submit" id="submit">Calcular</button>
      </form>
    </section>

    <section class="card result-card">
      <h2>2. Resultado</h2>
      <div id="result">
        <p class="placeholder">Aquí aparecerá la respuesta, la gráfica y las tablas.</p>
      </div>
    </section>
  </main>

  <script src="forms.js"></script>
  <script src="chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
